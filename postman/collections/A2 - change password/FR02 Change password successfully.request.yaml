$kind: http-request
url: "{{baseUrl}}/api/auth/password"
method: PUT
body:
  type: json
  content: "{\r

    \  \"oldPassword\": \"MEOmeo12345.\",\r

    \  \"newPassword\": \"TEST12345.\"\r

    }\r\n"
auth:
  type: bearer
  credentials:
    token: "{{jwt_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Password changes successfully\", function () {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Success message is returned\", function () {\r

      \  pm.expect(response.message).to.eql(\"Password updated successfully\");\r

      });\r

      \r

      pm.test(\"Response does not expose password data\", function () {\r

      \  pm.expect(response).to.not.have.property(\"password\");\r

      });\r

      \r

      pm.test(\"Response time is less than 2000ms\", function () {\r

      \  pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r\n"
    language: text/javascript
