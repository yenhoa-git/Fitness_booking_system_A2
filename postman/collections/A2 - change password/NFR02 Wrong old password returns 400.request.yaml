$kind: http-request
url: "{{baseUrl}}/api/auth/password"
method: PUT
body:
  type: json
  content: "{\r

    \  \"oldPassword\": \"WrongPassword123\",\r

    \  \"newPassword\": \"AnotherPassword123\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{jwt_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Wrong current password returns 400\", function () {\r

      \  pm.response.to.have.status(400);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Correct error message is returned\", function () {\r

      \  pm.expect(response.message).to.eql(\"Current password is incorrect\");\r

      });\r

      \r

      pm.test(\"Response does not expose password data\", function () {\r

      \  pm.expect(response).to.not.have.property(\"password\");\r

      });\r

      \r

      pm.test(\"Response time is less than 2000ms\", function () {\r

      \  pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });"
    language: text/javascript
