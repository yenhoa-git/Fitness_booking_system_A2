  - type: afterResponse
    code: "pm.test(\"Login succeeds\", function () {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Content-Type is JSON\", function () {\r

      \  pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Response contains JWT token\", function () {\r

      \  pm.expect(response).to.have.property(\"token\");\r

      });\r

      \r

      pm.test(\"Response contains member details\", function () {\r

      \  pm.expect(response).to.have.property(\"id\");\r

      \  pm.expect(response).to.have.property(\"email\");\r

      \  pm.expect(response).to.have.property(\"role\");\r

      });\r

      \r

      pm.test(\"Response time is less than 2000ms\", function () {\r

      \  pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      pm.environment.set(\"jwt_token\", response.token);\r

      console.log(\"JWT Token saved to environment\");\r

      \r

      \r\n"
